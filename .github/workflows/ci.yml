# Checks every push and pull request: backend tests (also against real PostgreSQL and MariaDB),
# frontend lint, type check, unit tests and build, and that both Docker images build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ncode-ci
          POSTGRES_DB: ncode_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ncode-ci
          MARIADB_DATABASE: ncode_test
          MARIADB_USER: ncode
          MARIADB_PASSWORD: ncode-ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      NCODE_TEST_PG_URL: postgresql+psycopg://postgres:ncode-ci@127.0.0.1:5432/ncode_test
      NCODE_TEST_MYSQL_URL: mysql+pymysql://ncode:ncode-ci@127.0.0.1:3306/ncode_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build   # includes the TypeScript check (tsc -b)

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
