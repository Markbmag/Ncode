# Migrations of Ncode's own database (users, sessions, connections, audit log; later
# questions and dashboards). They run automatically when the backend starts. By hand:
#
#     alembic upgrade head                                  # uses NCODE_APP_DB / backend/data/ncode.sqlite
#     alembic revision -m "add questions"                   # new empty migration (developers)

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
